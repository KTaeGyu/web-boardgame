# 소켓 서버의 배포 설계도. Render 에서 New → Blueprint 로 이 파일을 읽힌다.
#
# 화면(web)은 여기 없다. Vercel 이 맡는다 — 정적 파일과 늘 깨어 있어야 하는 소켓은
# 필요한 것이 다르다. 대신 둘이 서로의 주소를 알아야 해서 CORS_ORIGINS 와
# VITE_SOCKET_URL 이 서로를 가리킨다.

services:
  - type: web
    # 서비스 이름이 그대로 공개 주소가 된다.
    name: web-boardgame-server
    runtime: node
    # 한국에서 하는 게임이다. 다른 리전은 왕복이 150ms 를 넘겨 토큰이 굼떠 보인다.
    region: singapore
    plan: free
    # 저장소 뿌리에서 설치한다. 작업공간(workspaces)이라 shared 가 함께 이어져야 한다.
    buildCommand: npm install
    startCommand: npm start --workspace @the-gang/server
    # 잠든 인스턴스를 깨우고, 새 배포가 실제로 떴는지 판정하는 자리.
    healthCheckPath: /healthz
    envVars:
      # 빌드 단계가 없다. 서버는 .ts 를 그대로 실행하므로 22.18 이상이어야 한다.
      - key: NODE_VERSION
        value: 22.18.0
      # 화면이 어디에 있는가. Vercel 주소를 받은 뒤 대시보드에서 채운다.
      # 콤마로 여럿, 프리뷰까지 열려면 *.vercel.app 를 함께 넣는다.
      - key: CORS_ORIGINS
        sync: false
      # 무료 요금제의 이용량을 넘기지 않으려는 한도다. 게임 규칙이 아니다.
      - key: MAX_CONNECTIONS
        value: 40
      - key: MAX_ROOMS
        value: 8
