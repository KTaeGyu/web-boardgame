<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="잉웅">
  <!--
    이 한 장만 사람 얼굴이라 상자가 다르다. 다른 아홉은 rx 9 정사각인데
    여기는 세로로 길고 아래로 좁아지는 계란형이다 — 정사각으로 두면
    누구를 그려도 같은 얼굴이 된다. 폭 35 에 세로 41 이 그 비율이다.
  -->
  <defs>
    <clipPath id="ig-face">
      <path d="M14.4 21.4C14.4 15 18.6 10.5 24.8 10.5H39.2C45.4 10.5 49.6 15 49.6 21.4V33.4c0 5.8-3.4 11-8.2 14.2-3.2 2.1-6.4 3-9.4 3s-6.2-.9-9.4-3c-4.8-3.2-8.2-8.4-8.2-14.2Z"/>
    </clipPath>
  </defs>

  <!-- 목·어깨. 얼굴보다 먼저 깔려 턱에 가린다. -->
  <path d="M27.5 43.5h9v13.5h-9z" fill="#dfb88e"/>
  <path d="M6 64c.6-8.2 7.4-12 17.4-13 1.8 2.8 4.8 4.2 8.6 4.2s6.8-1.4 8.6-4.2C50.6 52 57.4 55.8 58 64Z"
        fill="#2b2b33" stroke="#3b3222" stroke-width="3" stroke-linejoin="round"/>

  <!-- 얼굴. -->
  <path d="M14.4 21.4C14.4 15 18.6 10.5 24.8 10.5H39.2C45.4 10.5 49.6 15 49.6 21.4V33.4c0 5.8-3.4 11-8.2 14.2-3.2 2.1-6.4 3-9.4 3s-6.2-.9-9.4-3c-4.8-3.2-8.2-8.4-8.2-14.2Z"
        fill="#efd3ad" stroke="#3b3222" stroke-width="3" stroke-linejoin="round"/>

  <g clip-path="url(#ig-face)">
    <ellipse cx="20.6" cy="40.2" rx="3.8" ry="2.2" fill="#e08a7a" opacity="0.18"/>
    <ellipse cx="43.4" cy="40.2" rx="3.8" ry="2.2" fill="#e08a7a" opacity="0.18"/>
    <!-- 잔수염은 면이 아니라 그림자다. 30px 에서는 사라진다. -->
    <ellipse cx="32" cy="41.2" rx="3.2" ry="1.5" fill="#6b5a3e" opacity="0.08"/>
    <ellipse cx="32" cy="46.2" rx="6.8" ry="6" fill="#6b5a3e" opacity="0.12"/>
  </g>

  <!--
    머리. 헤어라인이 눈썹보다 6 위에서 끝나야 이마가 넓게 남는다 —
    옆머리를 눈높이까지 내리면 곧장 헬멧이 된다. 양 끝을 한 단 더
    올려 M자 기미를 내고, 가운데 노치가 가르마 자리다.
  -->
  <path d="M13.8 28.6C11.4 19.4 15.8 8.4 27.4 6.8 39.2 5.2 51.2 11.2 52.6 22.4c.3 2.3 0 4.3-.8 6.2-1.2-4.3-2.6-7-4.9-8.8-4.1-3.1-10.1-2.1-14.8 1-1.4.9-2.7 1.4-4.1 1.6-1.8-2.7-5.1-3.3-7.6-1.8-2.9 1.8-5.6 4.5-7.2 8Z"
        fill="#2e2620"/>
  <!-- 웨이브. 봉우리가 아니라 잔 물결이라 선이 얕다. -->
  <g stroke="#181310" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M34.2 20.2c3-2.1 6.6-2.7 9.2-1.1"/>
    <path d="M36.8 14.4c3.6-1.3 7.6-.6 10.2 1.8"/>
    <path d="M20.2 19.4c1.9-1 3.6-1.1 5.1-.4"/>
  </g>
  <!-- 가르마는 모양이 아니라 갈라진 «선»이다. -->
  <path d="M28.4 22.4C29.2 17.3 31 12 33.8 8" stroke="#100d0a" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- 눈썹. 굵은 일자에 산이 없고, 눈과의 간격이 좁다. -->
  <g stroke="#2e2620" stroke-width="2.9" stroke-linecap="round">
    <path d="M20.2 30.1 29 28.9"/>
    <path d="M43.8 30.1 35 28.9"/>
  </g>

  <!--
    눈. 다른 아바타처럼 동그란 알로 두면 이 사람이 아니다 —
    가늘고 길게 눕히고 바깥쪽 끝을 내려 눈꼬리를 처지게 한다.
  -->
  <ellipse cx="24.6" cy="34.8" rx="4.6" ry="2" fill="#3b3222" transform="rotate(-8 24.6 34.8)"/>
  <ellipse cx="39.4" cy="34.8" rx="4.6" ry="2" fill="#3b3222" transform="rotate(8 39.4 34.8)"/>

  <!-- 입. 한쪽 끝만 올라간다. -->
  <path d="M27 43.6q4.6 3.4 10.4-1.8" stroke="#3b3222" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
