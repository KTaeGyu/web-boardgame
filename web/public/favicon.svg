<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="더 갱">
  <!--
    탭 아이콘은 16px 로 그려진다. 그래서 선이 아니라 실루엣이고,
    빈틈은 1px(=여기서 2 단위)보다 넓어야 눈에 남는다. 모자와 스페이드 사이가 그 자리다.

    펠트 초록은 두 테마가 같은 값을 쓴다. 조명이 바뀐다고 테이블이 바뀌지는 않는다.
  -->
  <rect width="32" height="32" rx="7" fill="#1a4d3a"/>

  <g fill="#d4af37">
    <!-- 중절모 : 크라운과 챙 -->
    <path d="M11.2 8.6 C11.2 5.0 12.8 3.4 16 3.4 C19.2 3.4 20.8 5.0 20.8 8.6 Z"/>
    <ellipse cx="16" cy="8.7" rx="9.6" ry="1.7"/>

    <!--
      스페이드 : 한 줄짜리 곡선 대신 삼각형 + 두 원이 겹쳐 하나의 실루엣이 된다.
      같은 fill 이라 경계가 보이지 않고, 작은 크기에서 형태가 무너지지 않는다.
    -->
    <path d="M16 12.6 L23.4 21.8 L8.6 21.8 Z"/>
    <circle cx="11.9" cy="21.4" r="4.4"/>
    <circle cx="20.1" cy="21.4" r="4.4"/>
    <path d="M16 20.6 C16 24.0 14.7 26.2 12.6 27.4 L19.4 27.4 C17.3 26.2 16 24.0 16 20.6 Z"/>
  </g>

  <!-- 모자 밴드. 크라운과 챙이 만나는 자리를 가로지른다 -->
  <path d="M11.2 6.9 H20.8 V8.6 H11.2 Z" fill="#8a7328"/>
</svg>
