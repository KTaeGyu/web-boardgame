<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" preserveAspectRatio="xMaxYMid slice">
  <!-- 달은 성(castle.svg)의 것과 같은 어법이다 — 옅게 두어 무늬가 이름과 다투지 않게. -->
  <circle cx="214" cy="12" r="10" fill="#e8dfc0" opacity="0.55"/>
  <!--
    무늬는 오른쪽에 몬다. 언덕이 오른쪽에서 솟아 왼쪽으로 낮아지고, 글자 자리에
    닿을 때쯤 바닥이다(night-city.svg 와 같은 이유).
  -->
  <path d="M240 48H124q28-14 54-13t36 5 26 2z" fill="#3f4867"/>
  <!-- 달을 보는 토끼. 통짜 그림자로 둔다 — 이만한 자리에서 이목구비는 읽히지 않는다. -->
  <g fill="#2a3049">
    <path d="M165 37q0-9.5 8-9.5t8 9.5z"/>
    <path d="M169 29l-2-10.5a2 2 0 0 1 3.9-0.8l2 10.5z"/>
    <path d="M175.6 28.6l1-10.6a2 2 0 0 1 4 0.4l-1.1 10.6z"/>
  </g>
</svg>
