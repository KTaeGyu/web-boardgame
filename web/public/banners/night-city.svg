<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" preserveAspectRatio="xMaxYMid slice">
  <!--
    빌딩은 오른쪽에 몬다. 왼쪽 끝까지 채우면 줄 전체가 무늬로 덮여 이름과 다툰다 —
    다른 배너들이 조용한 것도 오른쪽에만 있기 때문이다.
  -->
  <g fill="#3f4867">
    <rect x="120" y="30" width="16" height="18"/><rect x="140" y="20" width="12" height="28"/>
    <rect x="156" y="34" width="18" height="14"/><rect x="178" y="14" width="14" height="34"/>
    <rect x="196" y="26" width="12" height="22"/><rect x="212" y="8" width="16" height="40"/>
    <rect x="232" y="28" width="8" height="20"/>
  </g>
  <g fill="#e6c96a" opacity="0.5">
    <rect x="144" y="26" width="3" height="4"/><rect x="144" y="36" width="3" height="4"/>
    <rect x="182" y="20" width="3" height="4"/><rect x="187" y="28" width="3" height="4"/>
    <rect x="182" y="36" width="3" height="4"/><rect x="216" y="14" width="3" height="4"/>
    <rect x="222" y="22" width="3" height="4"/><rect x="216" y="32" width="3" height="4"/>
  </g>
</svg>
